name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      # judged code runs inside srt in production; here it runs without, and the fence's own
      # tests skip when srt is not installed
      - run: uv run --frozen python -m pytest -q
        env:
          BLINDED_UNFENCED: "1"
      - run: uv run --frozen sphinx-build -W --keep-going -q -b html docs docs/_build/html
